<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDM Linux Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 320px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: white;
    }

    .header small {
      display: block;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.online { background: #22c55e; animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text { flex: 1; font-size: 12px; color: #94a3b8; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #0f3460;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .toggle-label { color: #cbd5e1; font-size: 13px; }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #334155;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .toggle-slider:before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .toggle-slider { background: #e74c3c; }
    input:checked + .toggle-slider:before { transform: translateX(16px); }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.15s;
      margin-bottom: 6px;
    }

    .btn:hover { opacity: 0.85; }
    .btn:last-child { margin-bottom: 0; }

    .btn-primary { background: #e74c3c; color: white; }
    .btn-secondary { background: #1e3a5f; color: #93c5fd; }
    .btn-ghost { background: #1e293b; color: #64748b; }

    .url-input-row {
      display: flex;
      gap: 6px;
    }

    .url-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 7px 10px;
      color: #e2e8f0;
      font-size: 12px;
      outline: none;
    }

    .url-input:focus { border-color: #e74c3c; }

    .url-input::placeholder { color: #475569; }

    .btn-icon {
      background: #e74c3c;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      color: white;
      transition: opacity 0.15s;
    }

    .btn-icon:hover { opacity: 0.85; }

    .footer {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-link {
      font-size: 11px;
      color: #475569;
      text-decoration: none;
      cursor: pointer;
    }

    .footer-link:hover { color: #94a3b8; }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #1e3a5f;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">⬇</div>
    <div>
      <h1>IDM Linux Bridge</h1>
      <small>Integração com Wine</small>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Verificando...</span>
    <span class="badge" id="versionBadge">v1.0</span>
  </div>

  <div class="section">
    <div class="section-title">Controles</div>
    <div class="toggle-row">
      <span class="toggle-label">Interceptar downloads</span>
      <label class="toggle">
        <input type="checkbox" id="toggleIntercept" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Notificações</span>
      <label class="toggle">
        <input type="checkbox" id="toggleNotifications" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Download manual</div>
    <div class="url-input-row">
      <input type="url" class="url-input" id="manualUrl" placeholder="Cole uma URL aqui...">
      <button class="btn-icon" id="manualDownload" title="Enviar ao IDM">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Ações rápidas</div>
    <button class="btn btn-secondary" id="btnFindVideos">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      Capturar vídeo desta página
    </button>
    <button class="btn btn-ghost" id="btnCheckBridge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
      </svg>
      Verificar bridge
    </button>
  </div>

  <div class="footer">
    <span class="footer-link" id="openDocs">📖 Documentação</span>
    <span class="footer-link" id="openSettings">⚙ Configurações</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
